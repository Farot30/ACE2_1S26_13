version: '3.8'

services:
  # MongoDB - Base de datos NoSQL
  mongodb:
    image: mongo:6.0
    container_name: park-guard-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: park_user
      MONGO_INITDB_ROOT_PASSWORD: park_password
      MONGO_INITDB_DATABASE: park_guard
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - park-guard-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Mosquitto - Broker MQTT
  mosquitto:
    image: eclipse-mosquitto:2.0
    container_name: park-guard-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      - park-guard-network
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "health/check", "-m", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Backend API
  backend:
    build: .
    container_name: park-guard-backend
    environment:
      FLASK_ENV: production
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: park_user
      MONGO_PASSWORD: park_password
      MONGO_DB: park_guard
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      SECRET_KEY: ${SECRET_KEY:-tu_clave_secreta_super_segura_aqui}
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - park-guard-network
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

volumes:
  mongodb_data:
  mosquitto_data:
  mosquitto_logs:

networks:
  park-guard-network:
    driver: bridge
