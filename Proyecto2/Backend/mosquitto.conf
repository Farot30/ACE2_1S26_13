persistence true
persistence_location /mosquitto/data/

# Escucha en todos los interfaces en el puerto 1883
listener 1883
protocol mqtt

# WebSocket listener (para el frontend)
listener 9001
protocol websockets

# Permitir conexiones anónimas (cambiar en producción)
allow_anonymous true

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true
