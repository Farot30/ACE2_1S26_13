version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: parkguard-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: G13          # Usuario administrador
      MONGO_INITDB_ROOT_PASSWORD: 202307820 # Cambia esto por una contraseña segura
      MONGO_INITDB_DATABASE: parkguard           # Base de datos por defecto
    ports:
      - "27017:27017"          # Expone el puerto al host (opcional, solo para pruebas)
    volumes:
      - ./data/mongo:/data/db  # Persistencia de datos
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro  # Script de inicialización (opcional)
    networks:
      - parkguard-network

# Definición de red interna para que los contenedores se comuniquen
networks:
  parkguard-network:
    driver: bridge