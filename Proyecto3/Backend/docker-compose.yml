version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: park-guard-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: park_user
      MONGO_INITDB_ROOT_PASSWORD: park_password
      MONGO_INITDB_DATABASE: park_guard
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - ./init-mongo.js:/docker-entrypoint-initdb.d/init-mongo.js:ro
    networks:
      - park-guard-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: park-guard-mosquitto
    ports:
      - "1883:1883"
      - "9001:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - mosquitto_data:/mosquitto/data
      - mosquitto_logs:/mosquitto/log
    networks:
      - park-guard-network
    healthcheck:
      test: [ "CMD", "mosquitto_pub", "-h", "localhost", "-t", "health/check", "-m", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    image: farot33/park-guard-backend:latest
    container_name: park-guard-backend
    environment:
      FLASK_ENV: production
      ENABLE_EMBEDDED_CONSUMER: "false"
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: park_user
      MONGO_PASSWORD: park_password
      MONGO_DB: park_guard
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      SECRET_KEY: ${SECRET_KEY:-tu_clave_secreta_super_segura_aqui}
    ports:
      - "5000:5000"
    depends_on:
      mongodb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - park-guard-network
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped

  consumer:
    build:
      context: .
      dockerfile: Dockerfile.consumer
    image: farot33/park-guard-consumer:latest
    container_name: park-guard-consumer
    environment:
      MQTT_BROKER: mosquitto
      MQTT_PORT: 1883
      MONGO_HOST: mongodb
      MONGO_PORT: 27017
      MONGO_USER: park_user
      MONGO_PASSWORD: park_password
      MONGO_DB: park_guard
    depends_on:
      mongodb:
        condition: service_healthy
      mosquitto:
        condition: service_healthy
    networks:
      - park-guard-network
    volumes:
      - ./logs:/app/logs
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    build:
      context: ../Frontend
      dockerfile: Dockerfile
    image: farot33/park-guard-frontend:latest
    container_name: park-guard-frontend
    environment:
      VITE_API_URL: http://192.168.0.6:5000
      VITE_MQTT_URL: ws://192.168.0.6:9001
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - park-guard-network
    restart: unless-stopped

  grafana:
    build:
      context: ./grafana
      dockerfile: Dockerfile
    image: farot33/park-guard-grafana:latest
    container_name: park-guard-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=parkguard123
      - GF_SERVER_ROOT_URL=http://192.168.0.6:3001
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      - GF_PLUGINS_ALLOW_LOADING_UNSIGNED_PLUGINS=marcusolsson-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/plugins:/var/lib/grafana/plugins
    networks:
      - park-guard-network
    depends_on:
      - backend
      - mongodb
    restart: unless-stopped

  metrics:
    image: node:20-alpine
    container_name: park-guard-metrics
    working_dir: /app
    command: sh -c "npm install mongodb --save 2>/dev/null && node metrics_server.js"
    volumes:
      - ./metrics_server.js:/app/metrics_server.js:ro
    environment:
      - MONGO_HOST=mongodb
      - MONGO_PORT=27017
      - MONGO_USER=park_user
      - MONGO_PASSWORD=park_password
      - MONGO_DB=park_guard
    ports:
      - "8080:8080"
    networks:
      - park-guard-network
    depends_on:
      - mongodb
    restart: unless-stopped

volumes:
  mongodb_data:
  mosquitto_data:
  mosquitto_logs:
  grafana_data:


networks:
  park-guard-network:
    driver: bridge
