persistence true
persistence_location /mosquitto/data/

# Escucha en todos los interfaces (IPv4 y IPv6)
listener 1883 0.0.0.0
protocol mqtt

listener 1883 ::
protocol mqtt

# WebSocket listener 
listener 9001 0.0.0.0
protocol websockets

# Permitir conexiones anónimas
allow_anonymous true

# Logging
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type all
log_timestamp true
